name: Build Zotero-jasminum-ai-outline

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-release.yml"
      - "patches/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REF: 9af49f7175d2257a15d1ee1598da893569510e29
  TAG: v1.1.44-ai.2
  RELEASE_FILE: Zotero-jasminum-ai-outline_v1.1.44-ai.2.xpi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom patches
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm 9.15.1
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.1"

      - name: Download pinned Jasminum source
        run: |
          git clone --quiet https://github.com/l0o0/jasminum.git jasminum-src
          git -C jasminum-src checkout --quiet "$UPSTREAM_REF"

      - name: Apply feature and branding patches
        run: |
          python3 patches/patch_jasminum_silent_outline.py jasminum-src
          python3 patches/patch_jasminum_outline_progress.py jasminum-src
          python3 patches/patch_jasminum_release_metadata.py jasminum-src

      - name: Install dependencies
        working-directory: jasminum-src
        run: pnpm install --no-frozen-lockfile

      - name: Type check and build XPI
        working-directory: jasminum-src
        run: pnpm run build

      - name: Prepare and validate XPI metadata
        run: |
          set -euo pipefail
          test -s jasminum-src/build/jasminum_1.1.44-ai.2.xpi
          cp jasminum-src/build/jasminum_1.1.44-ai.2.xpi "$RELEASE_FILE"
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path
          xpi = Path(os.environ["RELEASE_FILE"])
          import tempfile
          # The upstream scaffold reinjects update_url during packing.
          # Remove it from the final XPI without adding a duplicate ZIP entry.
          with tempfile.NamedTemporaryFile(suffix=".xpi", dir=xpi.parent, delete=False) as tmp:
              temp_path = Path(tmp.name)
          try:
              with zipfile.ZipFile(xpi, "r") as source, zipfile.ZipFile(temp_path, "w") as target:
                  candidates = [name for name in source.namelist() if name in ("manifest.json", "addon/manifest.json")]
                  assert len(candidates) == 1, f"Missing/ambiguous manifest.json: {candidates}"
                  for member in source.infolist():
                      data = source.read(member.filename)
                      if member.filename == candidates[0]:
                          manifest = json.loads(data)
                          manifest["applications"]["zotero"].pop("update_url", None)
                          data = (json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n").encode("utf-8")
                      target.writestr(member, data)
              os.replace(temp_path, xpi)
          finally:
              if temp_path.exists():
                  temp_path.unlink()
          # Read it back to verify the actual user-installable XPI.
          with zipfile.ZipFile(xpi, "r") as z:
              assert z.testzip() is None, "Corrupt XPI ZIP"
              manifest = json.loads(z.read(candidates[0]))
          assert manifest.get("version") == "1.1.44.2", manifest
          assert manifest.get("name") == "Zotero-jasminum-ai-outline", manifest
          zotero = manifest["applications"]["zotero"]
          assert zotero.get("id") == "jasminum@linxzh.com", zotero
          assert "update_url" not in zotero, zotero
          print("Validated:", xpi, "size=", xpi.stat().st_size, "version=", manifest["version"])
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zotero-jasminum-ai-outline-XPI
          path: ${{ env.RELEASE_FILE }}
          if-no-files-found: error

      - name: Publish new GitHub Release without overwriting old versions
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump the tag and versions before publishing again."
            exit 1
          fi
          gh release create "$TAG" "$RELEASE_FILE" \
            --title "Zotero-jasminum-ai-outline v1.1.44-ai.2" \
            --notes "茉莉花 Jasminum 1.1.44 非官方优化版。AI 全文大纲后台静默识别、自动写入、工具栏常驻和进度提示。插件显示名称：Zotero-jasminum-ai-outline；Zotero 内部版本号：1.1.44.2；使用与原版相同的插件 ID 以替换原版；禁用上游自动更新以避免覆盖修改。请先使用 PDF 副本测试。源码补丁见仓库 patches/；遵循 AGPL-3.0-or-later。"
