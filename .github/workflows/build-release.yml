name: Build Zotero-jasminum-ai-outline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-release.yml', 'patches/**', 'tests/**', 'build-support/**', 'README.md', 'updates-manual.json']
  workflow_dispatch:
permissions:
  contents: write
env:
  UPSTREAM_REF: d3b1b3227b0e46aaf56585c5c09ff9e343152ce4
  TAG: v1.1.45-ai.1
  RELEASE_FILE: Zotero-jasminum-ai-outline_v1.1.45-ai.1.xpi
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.1'
      - name: Download pinned official v1.1.45
        run: |
          git clone --quiet https://github.com/l0o0/jasminum.git jasminum-src
          git -C jasminum-src checkout --quiet "$UPSTREAM_REF"
      - name: Apply incremental customization and metadata
        run: |
          python3 patches/patch_smart_outline.py jasminum-src
          python3 patches/patch_jasminum_release_metadata.py jasminum-src
          cp build-support/pnpm-lock.yaml jasminum-src/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: jasminum-src
        run: pnpm install --frozen-lockfile
      - name: Run upstream and smart outline tests
        run: python3 tests/run-tests.py jasminum-src
      - name: Type check and build
        working-directory: jasminum-src
        run: pnpm run build
      - name: Validate installable XPI and SHA256
        run: python3 tests/prepare-xpi.py jasminum-src/build/jasminum_1.1.45-ai.1.xpi "$RELEASE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: Zotero-jasminum-ai-outline-XPI
          path: |
            ${{ env.RELEASE_FILE }}
            ${{ env.RELEASE_FILE }}.sha256
          if-no-files-found: error
      - name: Publish a new release without overwriting previous versions
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace any asset."
            exit 1
          fi
          gh release create "$TAG" "$RELEASE_FILE" "$RELEASE_FILE.sha256" \
            --title "Zotero-jasminum-ai-outline $TAG" --notes-file RELEASE-NOTES.md
